<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ingentive Agent OS</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0b1220;
    color: #e2e8f0;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(80% 60% at 30% 20%, rgba(99, 102, 241, 0.18), transparent 60%),
      radial-gradient(60% 50% at 80% 80%, rgba(56, 189, 248, 0.12), transparent 60%),
      #0b1220;
  }
  .center {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
  }
  .stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    min-width: 280px;
  }
  .logo-wrap {
    position: relative;
    width: 88px;
    height: 88px;
    display: grid;
    place-items: center;
  }
  .logo {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    background: #0b1220;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5),
      0 0 0 1px rgba(255, 255, 255, 0.08) inset;
    display: grid;
    place-items: center;
    animation: pop 0.8s cubic-bezier(0.2, 0.7, 0.2, 1.1);
  }
  .logo img {
    width: 44px;
    height: 44px;
    display: block;
  }
  /* rotating ring around the logo */
  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.06);
    border-top-color: rgba(255, 255, 255, 0.55);
    border-right-color: rgba(99, 102, 241, 0.55);
    animation: spin 1.1s linear infinite;
  }
  .title {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.1px;
    opacity: 0.95;
  }
  .status {
    font-size: 12.5px;
    opacity: 0.6;
    height: 16px;
    min-width: 260px;
    text-align: center;
    transition: opacity 0.3s;
  }
  .progress {
    width: 240px;
    height: 3px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
    position: relative;
  }
  /* Indeterminate sweep — visible while we haven't received a determinate
     progress update yet. Hidden once .progress has the data-determinate flag. */
  .progress::after {
    content: "";
    position: absolute;
    inset: 0;
    width: 40%;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, 0.65),
      transparent
    );
    animation: slide 1.6s ease-in-out infinite;
  }
  .progress.determinate::after { display: none; }
  .progress-fill {
    position: absolute;
    inset: 0;
    width: 0%;
    background: linear-gradient(
      90deg,
      rgba(99, 102, 241, 0.9),
      rgba(56, 189, 248, 0.9)
    );
    border-radius: 3px;
    transition: width 0.45s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .progress-count {
    margin-top: 6px;
    font-size: 11px;
    opacity: 0.45;
    letter-spacing: 0.3px;
    font-variant-numeric: tabular-nums;
  }
  .footer {
    position: absolute;
    bottom: 18px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    opacity: 0.35;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes pop {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }
  /* Fade-out applied right before we hand off to the dashboard */
  body.leaving .stack { animation: leave 0.35s ease forwards; }
  body.leaving .bg { animation: leave 0.45s ease forwards; }
  @keyframes leave {
    to { opacity: 0; transform: translateY(-8px); }
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="center">
  <div class="stack">
    <div class="logo-wrap">
      <div class="ring"></div>
      <div class="logo">
        <img id="logo-img" alt="" />
      </div>
    </div>
    <div class="title">Ingentive Agent OS</div>
    <div class="progress" id="progress">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="status" id="status">Starting…</div>
    <div class="progress-count" id="progress-count"></div>
  </div>
</div>
<div class="footer">Local dashboard</div>
<script>
  // The icon path is injected by the main process via query string so it
  // works whether we're running in dev or out of the packaged asar.
  const params = new URLSearchParams(location.search);
  const icon = params.get("icon");
  if (icon) {
    document.getElementById("logo-img").src = icon;
  }

  // Two phases of feedback:
  //   1. Pre-warmup: cycle generic "starting" messages on the indeterminate sweep
  //   2. Warmup running: live progress driven by the main process via
  //      window.__setWarmup({ done, total, current, complete })
  const statusEl = document.getElementById("status");
  const progressEl = document.getElementById("progress");
  const fillEl = document.getElementById("progress-fill");
  const countEl = document.getElementById("progress-count");

  const PROVIDER_LABELS = {
    claude: "Claude Code",
    codex: "Codex",
    cowork: "Claude Cowork",
    scout: "Microsoft Scout",
    copilot: "GitHub Copilot",
  };

  let receivedWarmup = false;
  let cycleI = 0;
  const cycleMessages = [
    "Starting local server…",
    "Discovering agent sessions…",
    "Reading transcripts…",
  ];
  function cycleStatus() {
    if (receivedWarmup) return;
    statusEl.style.opacity = "0";
    setTimeout(() => {
      statusEl.textContent = cycleMessages[cycleI % cycleMessages.length];
      statusEl.style.opacity = "0.6";
      cycleI++;
    }, 200);
  }
  statusEl.textContent = cycleMessages[0];
  cycleI = 1;
  const cycleInterval = setInterval(cycleStatus, 1400);

  // Called by the Electron main process via webContents.executeJavaScript
  // every ~400ms with the latest warmup status.
  window.__setWarmup = function (s) {
    if (!s) return;
    receivedWarmup = true;
    if (!progressEl.classList.contains("determinate")) {
      progressEl.classList.add("determinate");
    }
    const total = Math.max(1, s.total || 0);
    const done = Math.max(0, Math.min(total, s.done || 0));
    // Show the in-progress provider as "halfway" toward done so the fill
    // moves smoothly between full provider completions.
    const partial = s.current && !s.complete ? 0.5 : 0;
    const pct = ((done + partial) / total) * 100;
    fillEl.style.width = `${pct}%`;

    if (s.complete) {
      clearInterval(cycleInterval);
      statusEl.style.opacity = "0.9";
      statusEl.textContent =
        s.failed && s.failed.length > 0
          ? `Ready (${s.failed.length} provider${s.failed.length === 1 ? "" : "s"} unavailable)`
          : "Ready";
      countEl.textContent = "";
    } else if (s.current) {
      const label = PROVIDER_LABELS[s.current] || s.current;
      statusEl.style.opacity = "0.75";
      statusEl.textContent = `Warming ${label}…`;
      countEl.textContent = `${done} of ${total} providers`;
    } else {
      statusEl.style.opacity = "0.6";
      statusEl.textContent = "Preparing…";
      countEl.textContent = `${done} of ${total} providers`;
    }
  };
</script>
</body>
</html>
